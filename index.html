<style>
:root{--nt:#1d0f06;--nt2:#3a2412;--wood:#7a4a2e;--lamp:#ffb84d;--mint:#5eead4;--rose:#fb7185;--paper:#fff8ea;--ink:#1d2433}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}

button{font-family:inherit;cursor:pointer}

#dust{position:fixed;inset:0;pointer-events:none;overflow:hidden}

@keyframes rise{to{transform:translate(40px,-115vh)}}
main{position:relative;max-width:1040px;margin:0 auto;padding:0 16px 60px}
.hero{position:relative;text-align:center;padding:38px 10px 18px}
.lamp{position:absolute;left:50%;top:-80px;width:520px;height:340px;margin-left:-260px;background:radial-gradient(ellipse at top,rgba(255,184,77,.38),transparent 68%);animation:glow 5s ease-in-out infinite;pointer-events:none}

.cta{background:var(--lamp);color:var(--ink);border:0;border-radius:99px;padding:11px 22px;font-size:17px;font-weight:700;box-shadow:0 4px 0 #b9791a}
.cta.alt{background:#fff;box-shadow:0 4px 0 #9aa3b8}

.cta:active{transform:translateY(3px);box-shadow:0 1px 0 #b9791a}
#resume{margin-top:14px;position:relative}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 2px;background:linear-gradient(var(--nt) 80%,transparent)}
.tabs button{flex:none;border:0;border-radius:99px;padding:10px 18px;font-size:16px;font-weight:700;color:#fff;background:rgba(255,255,255,.09);transition:.2s}
.tabs button:hover{background:rgba(255,255,255,.18)}
.tabs button.on{background:var(--lamp);color:var(--ink);transform:translateY(-2px)}
h2{font-size:24px;margin:26px 0 12px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:26px;padding:22px 18px 30px;border-radius:12px;background:linear-gradient(transparent calc(100% - 14px),var(--wood) 0);box-shadow:0 14px 0 -6px #4d2c19}
.book{position:relative;perspective:800px;cursor:pointer;animation:drop .6s backwards}
.book:nth-child(2){animation-delay:.12s}.book:nth-child(3){animation-delay:.24s}

.cv{height:250px;border-radius:6px 14px 14px 6px;padding:18px 14px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:linear-gradient(145deg,var(--a),var(--b));box-shadow:inset -10px 0 0 rgba(0,0,0,.22),8px 12px 18px rgba(0,0,0,.45);transform:rotateY(14deg);transform-origin:right;transition:transform .35s,box-shadow .35s;font-family:Lora,serif}
.book:hover .cv{transform:rotateY(0) translateY(-10px) scale(1.03);box-shadow:inset -10px 0 0 rgba(0,0,0,.22),0 24px 28px rgba(0,0,0,.5)}
.cv .em{font-size:64px;text-align:center}

.bk-i{margin-top:10px;font-size:14px;opacity:.85}
.pb{height:6px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;background:var(--mint)}
.fv{background:rgba(0,0,0,.35);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;transition:.2s;flex:none}
.fv.on{color:var(--lamp);transform:scale(1.15)}
.book .fv{position:absolute;top:8px;left:8px;z-index:2}
.list{display:grid;gap:14px}
.au,.dl,.gm{background:var(--nt2);border-radius:18px;padding:14px 16px;border:1px solid rgba(255,255,255,.08)}
.auh{display:flex;align-items:center;gap:12px}
.auh>div{flex:1}.auh small{display:block;opacity:.7}
.pl{width:50px;height:50px;border-radius:50%;border:0;background:var(--lamp);color:var(--ink);font-size:20px;flex:none;box-shadow:0 4px 0 #b9791a}
.ply>.auh .pl{background:var(--rose);box-shadow:0 4px 0 #a02a45}
.wv{display:flex;align-items:center;gap:3px;height:34px}
.wv i{width:4px;height:8px;border-radius:3px;background:var(--mint)}
.ply .wv i{animation:wv .7s ease-in-out infinite alternate}
.wv i:nth-child(2n){animation-delay:.15s}.wv i:nth-child(3n){animation-delay:.3s}.wv i:nth-child(5n){animation-delay:.45s}
@keyframes wv{to{height:32px}}
.sp,.rl button,.rl label{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:99px;padding:5px 12px;font-size:14px}
.rl button.on{background:var(--mint);color:var(--ink)}
.ln{display:block;width:100%;text-align:left;direction:ltr;background:none;border:0;color:#dbe4ff;padding:7px 10px;border-radius:10px;font:500 17px Lora,serif;margin-top:4px;transition:.25s}
.ln.cur{background:rgba(255,184,77,.2);color:#fff;transform:translateX(6px)}
.rl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 4px;font-size:14px}
.chat{display:grid;gap:10px;margin-top:10px;max-height:420px;overflow:auto;padding:4px}
.bb{max-width:82%;padding:10px 14px;border-radius:18px;direction:ltr;text-align:left;font:500 17px Lora,serif;cursor:pointer;transition:.25s;animation:bub .4s backwards}
.bb[data-sp=A]{background:#27406f;border-bottom-left-radius:4px;justify-self:start}
.bb[data-sp=B]{background:#3b2a58;border-bottom-right-radius:4px;justify-self:end}
.bb em{display:none;font:400 14px Cairo;opacity:.8;margin-top:4px;direction:rtl;text-align:right}
.showtr .bb em{display:block}
.bb.cur{outline:3px solid var(--lamp);transform:scale(1.03)}
.bb.mine span{filter:blur(7px)}
.turn::after{content:"🎤 دورك! قلها بصوتك";display:block;text-align:center;color:var(--lamp);font-weight:700;margin-top:8px;animation:glow 1s infinite}
@keyframes bub{from{transform:scale(.6);opacity:0}}
.gh{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#fff;font-size:19px;font-weight:700;text-align:right;padding:0}
.gh small{opacity:.7;font-weight:400;flex:1;font-size:14px}
.gh span{transition:transform .3s}.gm.open .gh span{transform:rotate(180deg)}
.gb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s}.gm.open .gb{grid-template-rows:1fr}
.gi{overflow:hidden}.gm.open .gi{padding-top:10px}
.rule{background:rgba(94,234,212,.12);border-radius:12px;padding:10px 14px;margin:0 0 10px;line-height:1.8}
.ex{display:flex;align-items:center;gap:10px;margin:6px 0}
.ex button{background:var(--lamp);border:0;border-radius:50%;width:32px;height:32px;flex:none}
.ex span{direction:ltr;font:500 17px Lora,serif}.ex em{opacity:.7;font-size:14px;margin-right:auto}
.qz{margin-top:12px;padding-top:12px;border-top:1px dashed rgba(255,255,255,.2)}
.qz b{display:block;direction:ltr;text-align:left;font:700 18px Lora,serif;margin-bottom:8px}
.qz button{background:#fff;color:var(--ink);border:0;border-radius:12px;padding:8px 18px;margin:3px;font:700 17px Lora,serif}
.qz .ok{background:var(--mint);animation:pp .4s}.qz .bad{background:var(--rose);animation:sk .4s}

.rsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.rs{display:block;text-decoration:none;color:#fff;background:var(--nt2);border-radius:18px;padding:18px;border:1px solid rgba(255,255,255,.08);transition:.25s}
.rs:hover{transform:translateY(-6px) rotate(-1deg);border-color:var(--lamp)}
.rs .em{font-size:38px}.rs b{display:block;font-size:19px}.rs small{opacity:.75}
.empty{text-align:center;opacity:.7;padding:50px 0}
#rd{position:fixed;inset:0;z-index:20;background:rgba(8,12,22,.9);overflow:auto;padding:14px}
#rd[hidden]{display:none}
.rin{max-width:720px;margin:0 auto}
.rtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;font-family:Lora,serif}
.back{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:99px;padding:8px 16px;font:inherit}
.pgw{perspective:1400px}
.pg{background:var(--paper);color:var(--ink);border-radius:8px 20px 20px 8px;padding:30px 26px;text-align:center;box-shadow:inset -12px 0 18px -10px rgba(0,0,0,.3),0 24px 40px rgba(0,0,0,.5);transform-origin:right;animation:flip .7s}
@keyframes flip{from{transform:rotateY(-70deg);opacity:0}}
.sc{font-size:clamp(80px,20vw,130px);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.tx{font:500 clamp(22px,4.6vw,30px)/1.7 Lora,serif;margin:10px 0}
.w{cursor:pointer;border-radius:6px;padding:0 2px;transition:.15s}.w:hover{background:#ffe3a8}.w.hl{background:var(--lamp)}
.pg .ar{color:#a12a4a;font-size:20px;margin:6px 0}
.gl{background:#e6fbf7;border-radius:12px;padding:8px 12px;font-size:16px;margin:12px 0 0}
.rc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}

.hero h1{color:#ffd98a;text-shadow:0 3px 0 #6b3f14,0 0 34px rgba(255,184,77,.45)}
.lamp{transform:translateY(calc(var(--py,0px)*-.3))}
.case{position:relative;margin-top:6px;border:16px solid #5a3414;border-radius:12px;padding:6px 18px 4px;
background:repeating-linear-gradient(90deg,transparent 0 118px,rgba(0,0,0,.28) 118px 121px),linear-gradient(#c58a3d,#a06a28 60%,#8a561c);

.bay{position:relative;scroll-margin-top:70px}
.bay::before{content:"";position:absolute;inset:0 0 26px;background:linear-gradient(rgba(0,0,0,.5),transparent 42%);pointer-events:none}
.row{position:relative;z-index:1;display:flex;align-items:flex-end;flex-wrap:wrap;gap:5px;padding:34px 8px 0;min-height:330px}
.plank{position:relative;height:26px;margin:0 -22px;border-radius:3px;background:linear-gradient(#e2a955,#a56a28 45%,#6b3f14);box-shadow:0 16px 20px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.35)}
.plq{flex:none;position:relative;width:128px;height:190px;margin-inline-end:16px;border-radius:6px;background:linear-gradient(145deg,#f3d98b,#b98a2b 55%,#e0b457);border:4px solid #8a6414;box-shadow:inset 0 0 0 3px rgba(0,0,0,.15),0 8px 14px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px;color:#4a3208;font-weight:900;font-size:19px;text-align:center}
.plq::before{content:"";position:absolute;top:18px;width:40px;height:40px;border:7px solid #5a3f0a;border-radius:50%;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.plq span{font-size:34px}
.bk{position:relative;flex:none;width:var(--w);height:var(--h);border:0;padding:0;border-radius:3px 3px 1px 1px;color:#f3d98b;
background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(255,255,255,.14) 30%,rgba(0,0,0,.18) 70%,rgba(0,0,0,.55)),var(--c);
box-shadow:inset 0 10px 0 -6px rgba(255,255,255,.14),5px 0 9px rgba(0,0,0,.5);transform-origin:bottom center;
transform:rotate(calc(var(--lean) + var(--sway,0deg)));transition:transform .35s cubic-bezier(.3,1.5,.5,1),filter .3s}
.bk::before,.bk::after{content:"";position:absolute;left:0;right:0;height:5px;background:#e0b457;opacity:.85}
.bk::before{top:12px}.bk::after{bottom:12px}
.bk .tt{position:absolute;inset:24px 0 46px;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;overflow:hidden;font:700 14px/1.15 Lora,serif;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.bay:not(.in) .bk{opacity:0}

.bk:hover,.bk:focus-visible{transform:translateY(-26px) rotate(0) scale(1.06);z-index:4;filter:brightness(1.18)}
.tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:8px;background:#fff8ea;color:#1d2433;padding:6px 12px;border-radius:10px;font:600 13px Cairo;white-space:nowrap;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 6px 14px rgba(0,0,0,.5);text-shadow:none;writing-mode:horizontal-tb}
.tip b{display:block;font-family:Lora,serif}
.bk:hover .tip,.bk:focus-visible .tip{opacity:1}
.rb{position:absolute;top:-4px;right:6px;width:11px;height:36px;background:var(--lamp);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}

#md{position:fixed;inset:0;z-index:15;background:rgba(10,5,2,.85);overflow:auto;padding:16px}

.stick{position:sticky;top:0;z-index:5;background:linear-gradient(var(--nt) 86%,transparent)}

.bay{scroll-margin-top:125px}

.qp{margin-top:16px;background:rgba(0,0,0,.3);border-radius:18px;padding:16px}

let tok=0;
function stop(){tok++;try{speechSynthesis.cancel()}catch(_){}}
function halt(){stop();document.querySelectorAll(".ply,.cur,.turn").forEach(n=>n.classList.remove("ply","cur","turn"))}
function seq(items,rate,on,end){
  const my=++tok;try{speechSynthesis.cancel()}catch(_){}
  let i=0;
  (function n(){
    if(my!==tok)return;
    if(i>=items.length){end&&end();return}
    const it=items[i];on&&on(i);
    const nx=()=>{if(my!==tok)return;i++;n()};
    if(it.wait){setTimeout(nx,it.wait/rate);return}
    const u=new SpeechSynthesisUtterance(it.t);u.lang="en-US";u.rate=rate*.9;u.pitch=it.p||1;u.onend=nx;u.onerror=nx;
    try{speechSynthesis.speak(u)}catch(_){nx()}
  })();
}

  const was=card.classList.contains("ply");halt();if(toggle&&was)return;
  const d=TALK.find(x=>x.id===card.dataset.id),role=card.dataset.role;card.classList.add("ply");
  seq(d.x.slice(from).map(([s,en])=>role===s?{wait:1500+en.length*70}:{t:en,p:s==="B"?1.3:1}),spd,i=>{cur(card,".bb",from+i);card.classList.toggle("turn",role===d.x[from+i][0])},halt);
}

/* ---------- Reader ---------- */
function reader(id,i){
  const b=BOOKS.find(x=>x.id===id);i=Math.max(0,Math.min(i,b.p.length-1));
  document.querySelectorAll("#rd audio").forEach(a=>{a.pause();a.remove()});
  S.read[id]=i;S.last=id;save();
  const[em,en,ar]=b.p[i],rd=$("#rd");rd.hidden=false;rd.dataset.b=id;rd.dataset.i=i;
  rd.innerHTML=`<div class="rin"><div class="rtop"><button class="back" data-x>✕ إغلاق</button><b>${b.t}</b><span>${i+1} / ${b.p.length}</span></div><div class="pgw"><div class="pg"><div class="sc">${em}</div><p class="tx" dir="ltr">${en.split(" ").map(w=>`<span class="w">${w}</span>`).join(" ")}</p><p class="ar" id="tr" hidden>${ar}</p><p class="gl" id="gl">اضغط على أي كلمة لتسمعها وتعرف معناها</p></div></div><div class="rc"><button class="cta alt" data-pv ${i?"":"disabled"}>السابق</button><button class="cta" data-rd>🔊 اقرأ الصفحة</button>${b.src?`<button class="cta alt" data-bookaudio>🎧 استمع للكتاب كاملًا</button>`:""}<button class="cta alt" data-trn ${ar?"":"hidden"}>ع ترجمة</button><button class="cta alt" data-qs>❓ الأسئلة</button><button class="cta" data-nx>${i<b.p.length-1?"التالي":"اختبرني ❓"}</button></div></div>`;
}
$("#rd").addEventListener("click",async e=>{
  const rd=e.currentTarget,id=rd.dataset.b,i=+rd.dataset.i,t=e.target,b=BOOKS.find(x=>x.id===id);
  if(t.closest("[data-x]")){halt();rd.querySelectorAll("audio").forEach(a=>a.pause());rd.hidden=true;refresh();return}
  if(t.closest("[data-pv]")){rd.querySelectorAll("audio").forEach(a=>a.pause());halt();return reader(id,i-1)}
  if(t.closest("[data-nx]")){rd.querySelectorAll("audio").forEach(a=>a.pause());halt();if(i<b.p.length-1)return reader(id,i+1);halt();openQs("b:"+id);return}
  if(t.closest("[data-qs]")){rd.querySelectorAll("audio").forEach(a=>a.pause());halt();openQs("b:"+id);return}
  if(t.closest("[data-trn]")){$("#tr").hidden=!$("#tr").hidden;return}
  if(t.closest("[data-bookaudio]")){
    halt();const old=rd.querySelector("audio[data-realbook]");if(old){old.paused?old.play():old.pause();return}
    const player=document.createElement("audio");player.controls=true;player.dataset.realbook="1";player.src=b.src;player.style.cssText="display:block;width:min(100%,600px);margin:12px auto";rd.querySelector(".rc").after(player);player.play().catch(()=>{});return;
  }
  if(t.closest("[data-rd]")){
    const button=t.closest("[data-rd]");
    const text=b.p[i][1];
    const current=rd.querySelector("audio[data-pageaudio]");
    if(current){if(current.paused){current.play().catch(()=>{});button.textContent="⏸ إيقاف القراءة"}else{current.pause();button.textContent="🔊 اقرأ الصفحة"}return;}
    if(!b.pageAudio)b.pageAudio={};
    button.disabled=true;button.textContent=b.pageAudio[i]?"⏳ جارٍ تشغيل الصوت…":"⏳ جارٍ تجهيز الصوت الحقيقي…";
    try{
      if(!b.pageAudio[i]){
        b.pageAudio[i]=await createRealAudio(text,b.t+" — page "+(i+1),b.l);
        save();
      }
      if(rd.dataset.b!==id||Number(rd.dataset.i)!==i)return;
      const player=document.createElement("audio");player.dataset.pageaudio="1";player.src=b.pageAudio[i];player.preload="auto";player.style.display="none";
      rd.appendChild(player);
      player.onended=()=>{button.textContent="🔊 اقرأ الصفحة"};
      player.onpause=()=>{button.textContent="🔊 اقرأ الصفحة"};
      await player.play();button.textContent="⏸ إيقاف القراءة";
    }catch(err){button.textContent="⚠ تعذر تشغيل الصوت الحقيقي";alert("تعذر توليد صوت الصفحة الحقيقي: "+err.message)}
    finally{button.disabled=false}
    return;
  }
  const w=t.closest(".w");
  if(w){const k=w.textContent.toLowerCase().replace(/[^a-z']/g,"");sayT(w.textContent.replace(/[^\w']/g,""));$("#gl").textContent=w.textContent+(b.g[k]?" = "+b.g[k]:" 🔊")}
});

/* ---------- Main click handling ---------- */
app.addEventListener("click",e=>{
  const t=e.target;let el;
  if(el=t.closest("[data-go]")){const sc=$("#sh-"+el.dataset.go);if(sc)sc.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(el=t.closest("[data-favf]")){onlyFav=!onlyFav;el.classList.toggle("on",onlyFav);view();return}
  if(el=t.closest("[data-item]")){openItem(el.dataset.item);return}
  if(el=t.closest("[data-mx]")){closeMd();return}
  if(el=t.closest("[data-fav]")){const id=el.dataset.fav,i=S.fav.indexOf(id);i<0?S.fav.push(id):S.fav.splice(i,1);save();el.classList.toggle("on");favDirty=true;return}
  if(el=t.closest("[data-spd]")){spd=spd===1?1.25:spd===1.25?.7:1;document.querySelectorAll("[data-spd]").forEach(b=>b.textContent=spd+"×");return}
  if(el=t.closest("[data-play]")){playAudio(el.closest(".au"));return}
  if(el=t.closest("[data-ln]")){playAudio(el.closest(".au"),+el.dataset.ln,false);return}
  if(el=t.closest("[data-playt]")){playTalk(el.closest(".dl"));return}
  if(el=t.closest("[data-role]")){const c=el.closest(".dl");halt();c.dataset.role=el.dataset.role;c.querySelectorAll("[data-role]").forEach(b=>b.classList.toggle("on",b===el));c.querySelectorAll(".bb").forEach(b=>b.classList.toggle("mine",!!el.dataset.role&&b.dataset.sp===el.dataset.role));return}
  if(el=t.closest("[data-trd]")){el.classList.toggle("on");el.closest(".dl").classList.toggle("showtr");return}
  if(el=t.closest(".bb")){el.classList.remove("mine");sayT(el.querySelector("span").textContent,el.dataset.sp==="B"?1.3:1);return}
  if(el=t.closest("[data-acc]")){el.closest(".gm").classList.toggle("open");return}
  if(el=t.closest("[data-say]")){sayT(el.dataset.say);return}
  if(el=t.closest("[data-o]")){const z=el.closest(".qz");if(z.dataset.d)return;z.dataset.d=1;const ok=el.dataset.o===z.dataset.a;el.classList.add(ok?"ok":"bad");if(!ok)z.querySelector('[data-o="'+z.dataset.a+'"]').classList.add("ok");return}
  if(el=t.closest("[data-lv]")){lvF=el.dataset.lv;document.querySelectorAll("[data-lv]").forEach(b=>b.classList.toggle("on",b===el));view();return}
  if(el=t.closest("[data-add]")){openAdd();return}
  if(el=t.closest("[data-addsave]")){addSave();return}
  if(el=t.closest("[data-aisource]")){generateSource();return}

  if(el=t.closest("[data-speakq]")){sayT(QZ?.qs[QZ.i]?.q||"");return}
  if(el=t.closest("[data-part]")){qzPart(el);return}
  if(el=t.closest("[data-left],[data-right]")){qzMatch(el);return}
  if(el=t.closest("[data-clearorder]")){if(QZ&&!QZ.d){QZ.selected=[];document.querySelectorAll("[data-part]").forEach(b=>b.disabled=false);$("#chosen").textContent=""}return}
  if(el=t.closest("[data-checkorder]")){qzCheck("order");return}
  if(el=t.closest("[data-checkmatch]")){qzCheck("match");return}
  if(el=t.closest("[data-checkmissing]")){qzCheck("missing");return}
  if(el=t.closest("[data-qstart]")){qzStart(el.closest(".qp").dataset.k);return}
  if(el=t.closest("[data-qo]")){qzAnswer(el);return}
  if(el=t.closest("[data-qdel]")){const k=el.closest(".qp").dataset.k;mat(k);S.qs[k].splice(+el.dataset.qdel,1);save();panel(k);return}
  if(el=t.closest("[data-clearqs]")){clearAllQuestions(el.closest(".qp").dataset.k);return}
  if(el=t.closest("[data-removebook]")){removeSource(el.closest(".qp").dataset.k);return}
  if(el=t.closest("[data-qreset]")){const k=el.closest(".qp").dataset.k;delete S.qs[k];save();panel(k,"↺ تمت استعادة الأسئلة الجاهزة");return}
  if(el=t.closest("[data-gen]")){genQs(el.closest(".qp").dataset.k);return}
  if(el=t.closest("[data-delsrc]")){delSrc(el.closest(".qp").dataset.k);return}
  if(el=t.closest("[data-qlisten]")){const c=$("#mdb .au")||$("#mdb .dl");if(c)c.classList.contains("au")?playAudio(c):playTalk(c);return}
  if(el=t.closest("[data-open]")){reader(el.dataset.open,S.read[el.dataset.open]||0);return}
});

(function(){const d=$("#dust");for(let i=0;i<22;i++){const s=document.createElement("i");s.style.cssText="left:"+Math.random()*100+"%;animation-duration:"+(16+Math.random()*18)+"s;animation-delay:-"+Math.random()*20+"s;transform:scale("+(.5+Math.random())+")";d.appendChild(s)}})();

function startPublic(){
  KEY="prudleLib:guest";
  load();
  S.qs=S.qs||{};
  S.sc=S.sc||{};
  S.custom=S.custom||{};
  for(const t in S.custom) if(TY[t]) TY[t][1].push(...S.custom[t]);
  shell();
}
startPublic();
