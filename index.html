<script>
/* =========================
   Prudle Worker + verified UID auth bootstrap
   Read-only attendance; no Logout button
========================= */
const PRUDLE_WORKER = "https://api-prudle.abbassaboali.workers.dev";
const PRUDLE_LOGIN = "https://www.prudle-education.com/log-in-out";
const PRUDLE_HOSTS = new Set(["www.prudle-education.com","prudle-education.com","abbassaboali-alt.github.io"]);
const PRUDLE_SESSION_MS = 86400000;
let PRUDLE_READY = false;
function prudleStartTime(raw){
  if(!raw)return NaN;
  let n=Number(raw);
  if(!Number.isFinite(n))n=Date.parse(raw);
  if(Number.isFinite(n)&&n>0&&n<1e11)n*=1000;
  return n;
}
function prudleSessionValid(){
  const raw=localStorage.getItem("prudleDeviceSessionStartedAt") || sessionStorage.getItem("prudleDeviceSessionStartedAt");
  const n=prudleStartTime(raw);
  return Number.isFinite(n)&&n>0&&n<=Date.now()+60000&&Date.now()-n<PRUDLE_SESSION_MS;
}
function prudleToken(){return (sessionStorage.getItem("firebaseToken")||"").trim();}
function prudleUid(){return (sessionStorage.getItem("firebaseUid")||localStorage.getItem("authUid")||localStorage.getItem("firebaseUid")||"").trim();}
function prudleGoLogin(){location.replace(PRUDLE_LOGIN);}
async function logout(){
  const session=sessionStorage.getItem("prudleSessionId")||localStorage.getItem("prudleSessionId")||"";
  try{
    if(session)await fetch(PRUDLE_WORKER+"/auth/logout",{method:"POST",headers:{"Content-Type":"application/json","X-Prudle-Session":session},signal:AbortSignal.timeout(4000)});
  }catch(_){/* Continue local logout on connectivity failure. */}
  for(const store of [sessionStorage,localStorage]){
    for(const key of ["firebaseToken","firebaseUid","authUid","prudleSessionId","prudleDeviceSessionStartedAt","username","role","loginDate"]){store.removeItem(key);}
  }
  prudleGoLogin();
}
function prudleError(message, retry){
  PRUDLE_READY=false;
  document.body.classList.add("prudle-auth-pending");
  const gate=document.getElementById("prudleAuthGate");
  gate.style.display="flex";
  gate.replaceChildren();
  const label=document.createElement("p");label.textContent=message;gate.appendChild(label);
  if(retry){const b=document.createElement("button");b.className="btn";b.textContent="إعادة المحاولة";b.onclick=prudleBootstrap;gate.appendChild(b);}
}
async function prudleDb(body){
  if(!prudleSessionValid()){prudleGoLogin();throw Error("SESSION_EXPIRED");}
  const token=prudleToken();
  if(!token){prudleGoLogin();throw Error("TOKEN_MISSING");}
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),15000);
  let res,payload;
  try{
    res=await fetch(PRUDLE_WORKER+"/db",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify(body),signal:controller.signal});
    payload=await res.json().catch(()=>({}));
  }catch(e){throw Error(e.name==="AbortError"?"انتهت مهلة الاتصال بالخادم":"تعذر الاتصال بالخادم");}
  finally{clearTimeout(timer);}
  if(res.status===401){prudleGoLogin();throw Error("UNAUTHORIZED");}
  if(res.status===403)throw Error("لا توجد صلاحية لعرض هذه البيانات");
  if(!res.ok||payload.success===false||payload.ok===false)throw Error(String(payload.error||payload.message||"فشل طلب البيانات: "+res.status));
  return payload.data??payload;
}
function prudleDocs(result){
  const arr=Array.isArray(result?.documents)?result.documents:Array.isArray(result)?result:[];
  return arr.map(d=>{
    const data=d?.data&&typeof d.data==="object"?d.data:d;
    return {...data,id:String(d.id||d.documentId||data.id||d.name?.split("/").pop()||"")};
  });
}
function prudleRoles(user){
  let roles=Array.isArray(user.roles)?user.roles:[];
  if(typeof user.roles==="string"){
    try{const parsed=JSON.parse(user.roles);roles=Array.isArray(parsed)?parsed:[user.roles];}
    catch{roles=[user.roles];}
  }
  if(user.role)roles=[...roles,user.role];
  return roles.map(r=>String(r).trim().toLowerCase());
}
async function prudleBootstrap(){
  prudleError("جاري التحقق من صلاحيات الدخول...",false);
  try{
    if(location.protocol!=="https:"||!PRUDLE_HOSTS.has(location.hostname.toLowerCase())){prudleGoLogin();return;}
    if(!prudleSessionValid()||!prudleToken()||!prudleUid()){prudleGoLogin();return;}
    const users=prudleDocs(await prudleDb({action:"query",collection:"USERS",filters:[{field:"authUid",op:"==",value:prudleUid()}],limit:2}));
    if(users.length!==1)throw Error("تعذر التحقق من حساب المستخدم عبر USERS");
    if(!prudleRoles(users[0]).includes("admin")){prudleError("هذه الصفحة مخصصة للمشرف بصلاحية admin فقط",false);return;}
    await loadAttendanceData();
    PRUDLE_READY=true;
    document.body.classList.remove("prudle-auth-pending");
    document.getElementById("prudleAuthGate").style.display="none";
  }catch(e){
    if(["SESSION_EXPIRED","TOKEN_MISSING","UNAUTHORIZED"].includes(e.message))return;
    prudleError(e.message||"تعذر تحميل البيانات",true);
  }
}
window.addEventListener("pageshow",()=>{if(PRUDLE_READY&&!prudleSessionValid())prudleGoLogin();});
window.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s")e.preventDefault();},{capture:true});

/* =========================
   CONFIG
========================= */
const LOGO_URL = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS2cRc2rxfALVprygCmO_V7cJra9eZF1MUzpuJ3NnWd&s";
const DIRECTOR_NAME = "Prudle Institute Administration";

/* Database reads are performed only by prudleDb(). */

/* =========================
   State
========================= */
let COURSES = [];
let STUDENTS = [];
let ACTIVE_COURSES = [];
let SELECTED_IDS = new Set();
let chartInstance = null;

/* =========================
   Helpers
========================= */
const normalize = s => (s||"").toString().toLowerCase()
  .replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/\s+/g," ").trim();

const isWeekend = d => [5,6].includes(new Date(d).getDay());
const dayNameAr = d => new Date(d).toLocaleDateString("ar",{weekday:"short"});
const dayNameEn = d => new Date(d).toLocaleDateString("en-US",{weekday:"short"});

function dateRange(s,e){
  let a=[],d=new Date(s),x=new Date(e);
  if(isNaN(d.getTime()) || isNaN(x.getTime())) return a;
  while(d<=x){
    a.push(d.toISOString().split("T")[0]);
    d.setDate(d.getDate()+1);
  }
  return a;
}
function getRec(s,d){
  return (s.records||[]).filter(r=>r.date===d).pop() || {};
}
function safePhone(p){
  let x=String(p||"").trim();
  if(!x) return "";
  x=x.replace(/\s+/g,"");
  if(x.startsWith("0")) x=x.slice(1);
  if(!x.startsWith("966")) x="966"+x;
  return x;
}

/* ===== Period smart sort ===== */
function periodRank(v){
  const s = String(v||"").toLowerCase();
  if(s.includes("صباح") || s.includes("am") || s.includes("morning")) return 1;
  if(s.includes("ظهر") || s.includes("noon")) return 2;
  if(s.includes("عصر")) return 3;
  if(s.includes("مساء") || s.includes("pm") || s.includes("evening") || s.includes("night")) return 4;
  const num = (s.match(/\d+/)||[])[0];
  if(num) return 10 + Number(num);
  return 99;
}
function sortSmart(arr){
  return (arr||[]).slice().sort((a,b)=>{
    const ra = periodRank(a);
    const rb = periodRank(b);
    if(ra !== rb) return ra - rb;
    return String(a||"").localeCompare(String(b||""), "ar", {numeric:true, sensitivity:"base"});
  });
}
const uniq = a => [...new Set((a||[]).filter(Boolean))];

/* =========================
   Load Data
========================= */
async function prudleAllDocs(collection,filters=[]){
  const docs=[];
  const seenIds=new Set();
  const seenCursors=new Set();
  let cursor=null;
  for(let page=0;page<1000;page++){
    const body={action:"query",collection,filters,limit:400,paginate:true};
    if(cursor!==null)body.cursor=cursor;
    const result=await prudleDb(body);
    if(!result||!Array.isArray(result.documents)||typeof result.hasMore!=="boolean"){
      throw Error("BACKEND_PAGINATION_REQUIRED: صيغة ترقيم صفحات Worker غير متوافقة؛ لم تُعرض بيانات ناقصة");
    }
    for(const doc of prudleDocs(result)){
      if(!doc.id)throw Error("مستند بلا معرف من Worker");
      if(!seenIds.has(doc.id)){seenIds.add(doc.id);docs.push(doc);}
    }
    if(!result.hasMore)return docs;
    const next=result.nextCursor;
    if(!next||seenCursors.has(next))throw Error("BACKEND_PAGINATION_REQUIRED: توقف مؤشر صفحات Worker");
    seenCursors.add(next);cursor=next;
  }
  throw Error("BACKEND_PAGINATION_REQUIRED: تجاوز عدد صفحات التحميل الحد الآمن");
}

/* =========================
   Fill Filters
========================= */
function fillFilters(){
  const fill = (el, values, sorter=null) => {
    const first = el.options[0]?.text || "";
    let list = uniq(values);
    if(sorter) list = sorter(list);
    else list = list.sort((a,b)=> String(a).localeCompare(String(b),"ar",{numeric:true,sensitivity:"base"}));
    el.innerHTML = `<option value="">${first}</option>` + list.map(v=>`<option value="${v}">${v}</option>`).join("");
  };

  fill(branchFilter,  COURSES.map(c=>c.Branch));
  fill(sectionFilter, COURSES.map(c=>c.Section));
  fill(trainerFilter, COURSES.map(c=>c.Trainer));
  fill(courseFilter,  COURSES.map(c=>c.TrainingCourse));
  fill(periodFilter,  COURSES.map(c=>c.Period), sortSmart);
  fill(startDateFilter,COURSES.map(c=>c.StartingDate), (x)=>x.sort((a,b)=> new Date(b)-new Date(a)));
}

/* =========================
   Apply Filter
========================= */
function applyFilter(){
  const hasFilter =
    branchFilter.value ||
    sectionFilter.value ||
    trainerFilter.value ||
    courseFilter.value ||
    periodFilter.value ||
    startDateFilter.value;

  if(!hasFilter){
    tableWrap.style.display="none";
    coursesContainer.innerHTML="";
    infoBox.textContent="⚠ اختر فلترة أولاً لعرض البيانات";
    ACTIVE_COURSES = [];
    SELECTED_IDS.clear();
    fillDayColumnFilter();
    updateStats(0,0,0,"",0,0,0,0,"0%");
    return;
  }

  ACTIVE_COURSES = COURSES.filter(c =>
    (!branchFilter.value   || c.Branch === branchFilter.value) &&
    (!sectionFilter.value  || c.Section === sectionFilter.value) &&
    (!trainerFilter.value  || c.Trainer === trainerFilter.value) &&
    (!courseFilter.value   || c.TrainingCourse === courseFilter.value) &&
    (!periodFilter.value   || c.Period === periodFilter.value) &&
    (!startDateFilter.value|| c.StartingDate === startDateFilter.value)
  );

  ACTIVE_COURSES = ACTIVE_COURSES.slice().sort((a,b)=>{
    const ra = periodRank(a.Period);
    const rb = periodRank(b.Period);
    if(ra !== rb) return ra - rb;

    const ca = String(a.TrainingCourse||"");
    const cb = String(b.TrainingCourse||"");
    const cc = ca.localeCompare(cb, "ar", {numeric:true, sensitivity:"base"});
    if(cc !== 0) return cc;

    const ta = String(a.Trainer||"");
    const tb = String(b.Trainer||"");
    return ta.localeCompare(tb, "ar", {numeric:true, sensitivity:"base"});
  });

  SELECTED_IDS.clear();

  if(!ACTIVE_COURSES.length){
    tableWrap.style.display="none";
    coursesContainer.innerHTML="";
    infoBox.textContent="لا توجد نتائج مطابقة للفلترة";
    fillDayColumnFilter();
    updateStats(0,0,0,"",0,0,0,0,"0%");
    return;
  }

  fillDayColumnFilter();
  tableWrap.style.display="block";
  renderAllCourses();
}

/* =========================
   Fill Day Column Filter
========================= */
function fillDayColumnFilter(){
  const select = document.getElementById("dayColumnFilter");
  const keep = select.value || "";

  let allDays = [];
  ACTIVE_COURSES.forEach(c=>{
    const days = dateRange(c.StartingDate, c.EndingDate);
    allDays = allDays.concat(days);
  });

  allDays = [...new Set(allDays)].sort((a,b)=> new Date(a) - new Date(b));

  select.innerHTML =
    `<option value="">اليوم (اختياري)</option>` +
    allDays.map(d=>`<option value="${d}">${d} - ${dayNameAr(d)}</option>`).join("");

  if(keep && allDays.includes(keep)) select.value = keep;
  else select.value = "";
}

function setSelectedDay(d){
  const sel = document.getElementById("dayColumnFilter");
  if(!d) return;
  const opt = [...sel.options].some(o=>o.value===d);
  if(!opt) return;
  sel.value = d;
  renderAllCourses();
}

/* =========================
   ✅ Selection Helpers + ✅ Instant Search (AR/EN/ID)
========================= */
function getVisibleStudentsForCourse(course, q){
  const students = STUDENTS.filter(s=>s.courseId === course.id);
  const qq = normalize(q||"");
  return students.filter(s=>{
    if(!qq) return true;

    const fields = [
      s.iqama,
      s.identity,
      s.name,
      s.name_ar,
      s.name_en
    ];

    return fields.some(v => normalize(v).includes(qq));
  });
}

function selectAll(){
  if(!ACTIVE_COURSES.length){
    alert("اختر فلترة أولاً");
    return;
  }
  SELECTED_IDS.clear();
  const q = normalize(searchInput.value);
  ACTIVE_COURSES.forEach(course=>{
    const list = getVisibleStudentsForCourse(course, q);
    list.forEach(s=>SELECTED_IDS.add(s.id));
  });
  renderAllCourses();
}
function clearSelection(){
  SELECTED_IDS.clear();
  renderAllCourses();
}
function toggleCourseAll(courseId, checked){
  const course = ACTIVE_COURSES.find(c=>c.id===courseId);
  if(!course) return;
  const q = normalize(searchInput.value);
  const list = getVisibleStudentsForCourse(course, q);
  if(checked) list.forEach(s=>SELECTED_IDS.add(s.id));
  else list.forEach(s=>SELECTED_IDS.delete(s.id));
  renderAllCourses();
}

function selectByDay(statusNeed){
  if(!ACTIVE_COURSES.length){
    alert("اختر فلترة أولاً");
    return;
  }
  const selectedDay = dayColumnFilter.value;
  if(!selectedDay){
    alert("اختر اليوم من القائمة (اليوم اختياري لكن للتحديد لازم تختاره)");
    return;
  }

  SELECTED_IDS.clear();
  const q = normalize(searchInput.value);

  ACTIVE_COURSES.forEach(course=>{
    const days = dateRange(course.StartingDate, course.EndingDate);
    if(!days.includes(selectedDay)) return;

    const visible = getVisibleStudentsForCourse(course, q);
    visible.forEach(s=>{
      const st = (getRec(s,selectedDay).status||"").toLowerCase();
      if(st===statusNeed){
        SELECTED_IDS.add(s.id);
      }
    });
  });

  renderAllCourses();
}

/* =========================
   ✅ Render ALL courses blocks
   ✅ عمود الاسم: EN فوق + AR تحت
========================= */
function renderAllCourses(){
  if(!ACTIVE_COURSES.length){
    tableWrap.style.display="none";
    updateStats(0,0,0,"",0,0,0,0,"0%");
    return;
  }

  const q = normalize(searchInput.value);
  const selectedDay = dayColumnFilter.value || "";
  coursesContainer.innerHTML = "";

  let totalStudentsShown = 0;
  let totalCoursesShown  = 0;

  let dayP=0, dayL=0, dayA=0, dayN=0, dayTotal=0;

  ACTIVE_COURSES.forEach(course=>{
    const days = dateRange(course.StartingDate, course.EndingDate);
    const visibleStudents = getVisibleStudentsForCourse(course, q);

    totalCoursesShown++;
    totalStudentsShown += visibleStudents.length;

    const dayInCourse = selectedDay && days.includes(selectedDay);

    if(dayInCourse){
      visibleStudents.forEach(s=>{
        const st = (getRec(s,selectedDay).status||"none").toLowerCase();
        if(st==="present") dayP++;
        else if(st==="late") dayL++;
        else if(st==="absent") dayA++;
        else dayN++;
        dayTotal++;
      });
    }

    const title = `${course.TrainingCourse||"-"} | ${course.Period||"-"} | ${course.Trainer||"-"}`;
    const meta  = `الفرع: ${course.Branch||"-"} | القسم: ${course.Section||"-"} | ${course.StartingDate||"-"} → ${course.EndingDate||"-"} | طلاب: ${visibleStudents.length} | أيام: ${days.length}`;

    const allChecked = visibleStudents.length
      ? visibleStudents.every(s=>SELECTED_IDS.has(s.id))
      : false;

    const theadHTML = `
      <thead>
        <tr>
          <th style="min-width:44px">#</th>
          <th style="min-width:52px">
            <input type="checkbox" ${allChecked?"checked":""}
              onclick="toggleCourseAll('${course.id}', this.checked)">
          </th>

          <!-- ✅ هيدر الاسم -->
          <th style="min-width:300px;text-align:right">الطالب</th>

          ${days.map(d=>`
            <th class="th-day ${isWeekend(d)?'weekend':''} ${selectedDay===d?'col-selected':''}"
                onclick="setSelectedDay('${d}')"
                title="اضغط لاختيار هذا اليوم للتقرير والتحديد">
              <div style="font-weight:900">${dayNameAr(d)}</div>
              <div style="font-size:10px">${d}</div>
            </th>
          `).join("")}
          <th style="min-width:100px">واتس</th>
        </tr>
      </thead>
    `;

    const bodyRows = visibleStudents.map((s,idx)=>{
      let dayStatus = "";
      if(selectedDay && days.includes(selectedDay)){
        dayStatus = (getRec(s,selectedDay).status||"").toLowerCase();
      }

      const isDayAbsent = (dayStatus === "absent");
      const isDayPresent = (dayStatus === "present");

      const cells = days.map(d=>{
        const r = getRec(s,d);
        const st = (r.status||"none").toLowerCase();
        const code = st==="present" ? "P" : st==="late" ? "L" : st==="absent" ? "A" : "";
        const selClass = (selectedDay && d===selectedDay) ? "col-selected" : "";
        return `
          <td class="${isWeekend(d)?'weekend':''} ${selClass}">
            <div class="cell ${st}">${code}</div>
          </td>
        `;
      }).join("");

      const phone = safePhone(s.phone);
      let waClass = phone ? "wa-row-btn" : "wa-row-btn disabled";
      if(phone && isDayAbsent) waClass += " day-absent";
      if(phone && isDayPresent) waClass += " day-present";

      const nameClass =
        isDayAbsent ? "name-day-absent" :
        isDayPresent ? "name-day-present" : "";

      // ✅ SAME AS FINANCIAL CODE EXACTLY
      const nameEN = (s.name || "");
      const nameAR = (s.name_ar || "");

      return `
        <tr>
          <td>${idx+1}</td>
          <td>
            <input type="checkbox"
              ${SELECTED_IDS.has(s.id)?"checked":""}
              onclick="this.checked?SELECTED_IDS.add('${s.id}'):SELECTED_IDS.delete('${s.id}')">
          </td>

          <!-- ✅ الاسم EN فوق + AR تحت + إظهار كامل -->
          <td class="${nameClass}" style="text-align:right;font-weight:900">
            <div class="name-en">${nameEN}</div>
            <div class="name-ar">${nameAR}</div>

            <div style="font-weight:800;font-size:11px;margin-top:4px;opacity:.95">
              ${s.iqama||s.identity||""}
              ${selectedDay && days.includes(selectedDay) && isDayAbsent ? ` | غائب: ${selectedDay}` : ""}
              ${selectedDay && days.includes(selectedDay) && isDayPresent ? ` | حاضر: ${selectedDay}` : ""}
            </div>
          </td>

          ${cells}
          <td>
            <button class="${waClass}" onclick="sendWhatsAppOne('${course.id}','${s.id}')">
              <i class="fa-brands fa-whatsapp"></i>
            </button>
          </td>
        </tr>
      `;
    }).join("");

    const block = document.createElement("div");
    block.className = "course-block";
    block.innerHTML = `
      <div class="course-head">
        <div>
          ${title}
          <div><small>${meta}</small></div>
        </div>
        <div class="course-actions">
          <button class="mini-btn" onclick="exportPDFSingleCourse('${course.id}')">PDF لهذه الدورة</button>
        </div>
      </div>
      <div class="course-body">
        <table>
          ${theadHTML}
          <tbody>${bodyRows || `<tr><td colspan="${days.length+4}" style="padding:14px;font-weight:900;color:#666">لا يوجد طلاب مطابقين للبحث</td></tr>`}</tbody>
        </table>
      </div>
    `;

    coursesContainer.appendChild(block);
  });

  const selCount = SELECTED_IDS.size;

  infoBox.textContent =
    `الدورات المعروضة: ${totalCoursesShown} | إجمالي الطلاب المعروضين: ${totalStudentsShown}` +
    (searchInput.value ? " | (نتائج البحث مفعّلة)" : "") +
    (selCount ? ` | المحدد: ${selCount}` : "") +
    (dayColumnFilter.value ? ` | اليوم المختار: ${dayColumnFilter.value}` : "");

  const rate = dayTotal ? (((dayP + dayL) / dayTotal) * 100).toFixed(1) : "0.0";
  updateStats(totalCoursesShown, totalStudentsShown, selCount, selectedDay, dayP, dayL, dayA, dayN, `${rate}%`);
}

/* =========================
   WhatsApp per row
========================= */
function sendWhatsAppOne(courseId, studentId){
  const course = ACTIVE_COURSES.find(c=>c.id===courseId) || COURSES.find(c=>c.id===courseId) || {};
  const students = STUDENTS.filter(s=>s.courseId===courseId);
  const s = students.find(x=>x.id===studentId);
  if(!s){ alert("لم يتم العثور على الطالب"); return; }

  const phone = safePhone(s.phone);
  if(!phone){ alert("لا يوجد رقم جوال لهذا الطالب"); return; }

  const selectedDay = dayColumnFilter.value || "";
  const days = dateRange(course.StartingDate, course.EndingDate);

  let note = "متابعة الحضور";
  let d = "";

  if(selectedDay && days.includes(selectedDay)){
    const st = (getRec(s,selectedDay).status||"").toLowerCase();
    d = selectedDay;
    if(st==="absent") note = `تنبيه: غياب في اليوم المحدد (${selectedDay})`;
    else if(st==="present") note = `تأكيد: حضور في اليوم المحدد (${selectedDay})`;
    else if(st==="late") note = `تنبيه: تأخر في اليوم المحدد (${selectedDay})`;
    else note = `متابعة رصد اليوم المحدد (${selectedDay})`;
  }else{
    const lastDay = days.length ? days[days.length-1] : "";
    if(lastDay){
      const st = (getRec(s,lastDay).status||"").toLowerCase();
      d = lastDay;
      if(st==="absent") note = `تنبيه: غياب في آخر يوم رصد (${lastDay})`;
      else if(st==="present") note = `تأكيد: حضور في آخر يوم رصد (${lastDay})`;
      else if(st==="late") note = `تنبيه: تأخر في آخر يوم رصد (${lastDay})`;
      else note = `متابعة رصد آخر يوم (${lastDay})`;
    }
  }

  const msg =
`السلام عليكم

${note}

الطالب: ${s.name_ar || s.name_en || s.name || "-"}
الهوية: ${s.iqama || s.identity || "-"}

الدورة: ${course.TrainingCourse || "-"}
المدرب: ${course.Trainer || "-"}
الفترة: ${course.Period || "-"}
الفرع: ${course.Branch || "-"}
القسم: ${course.Section || "-"}
اليوم: ${d || "-"}

نرجو الإفادة / العذر إن وجد.

شاكرين تعاونكم
إدارة معهد برودل`;

  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, "_blank");
}

/* =========================
   Chart image for PDF
========================= */
async function buildPieChartImage(totals){
  const canvas = document.getElementById("pdfChart");
  const ctx = canvas.getContext("2d");
  if(chartInstance) chartInstance.destroy();

  chartInstance = new Chart(ctx,{
    type:"doughnut",
    data:{
      labels:["Present","Late","Absent","No Record"],
      datasets:[{ data:[totals.present, totals.late, totals.absent, totals.none] }]
    },
    options:{
      responsive:false,
      animation:false,
      cutout:"62%",
      plugins:{
        legend:{ position:"right" },
        title:{
          display:true,
          text:"Attendance Summary",
          font:{ size:18, weight:"bold" }
        }
      }
    }
  });

  await new Promise(res=>setTimeout(res,80));
  return canvas.toDataURL("image/png", 1.0);
}

}

/* =========================================================
   EXECUTIVE PDF BUILDER (Landscape A4)
   ✅ Page 1: Executive Summary (chart only here)
   ✅ Next pages: Detailed per course (NO chart)
   ✅ الاسم في التفاصيل: EN فوق + AR تحت

function countAttendanceForStudent(s, days){
  let present=0, late=0, absent=0, none=0;
  days.forEach(d=>{
    const st=(getRec(s,d).status||"none").toLowerCase();
    if(st==="present") present++;
    else if(st==="late") late++;
    else if(st==="absent") absent++;
    else none++;
  });
  return {present,late,absent,none,total:days.length};
}
function totalsForStudents(students, days){
  let P=0,L=0,A=0,N=0;
  students.forEach(s=>{
    const c=countAttendanceForStudent(s,days);
    P+=c.present; L+=c.late; A+=c.absent; N+=c.none;
  });
  return {present:P,late:L,absent:A,none:N,totalCells:students.length*days.length};
}
