<script>
(function(){

  const LOGIN_URL =
    "https://www.prudle-education.com/log-in-out";

  function getRoles(){

    try{

      const roles =
        JSON.parse(
          localStorage.getItem("roles") || "[]"
        );

      if(
        Array.isArray(roles) &&
        roles.length
      ){

        return [
          ...new Set(
            roles
              .map(role =>
                String(role || "")
                  .trim()
                  .toLowerCase()
              )
              .filter(Boolean)
          )
        ];

      }

    }catch(error){

      console.warn(
        "Roles parse error:",
        error
      );

    }

    const oldRole =
      String(
        localStorage.getItem("role") ||
        localStorage.getItem("userRole") ||
        ""
      )
      .trim()
      .toLowerCase();

    return oldRole
      ? [oldRole]
      : [];

  }


  function hasRole(role){

    return getRoles().includes(
      String(role || "")
        .trim()
        .toLowerCase()
    );

  }

  function goLogin(){

    localStorage.removeItem("username");
    localStorage.removeItem("role");
    localStorage.removeItem("roles");
    localStorage.removeItem("userRole");
    localStorage.removeItem("loginDate");

    sessionStorage.clear();

    window.location.replace(
      LOGIN_URL
    );

  }


  function checkAdmin(){

    const username =
      String(
        localStorage.getItem("username") || ""
      ).trim();

    const loginDate =
      localStorage.getItem("loginDate");

    const today =
      new Date().toDateString();

    if(
      !username ||
      !loginDate ||
      loginDate !== today
    ){

      document.body.style.display = "none";

      alert(
        "انتهت جلسة الدخول أو لم يتم تسجيل الدخول."
      );

      window.location.replace(
        LOGIN_URL
      );

      return false;

    }

    if(
      !hasRole("admin")
    ){

      document.body.style.display = "none";

      alert(
        "هذه الصفحة للمدير فقط"
      );

      window.location.replace(
        "https://www.prudle-education.com/dashboard-manager"
      );

      return false;

    }

    document.body.style.display = "";

    return true;

  }


  window.logoutPrudle =
    function(){

      goLogin();

    };


  function initialCheck(){

    checkAdmin();

  }


  window.addEventListener(
    "pageshow",
    function(){

      checkAdmin();

    }
  );


  window.addEventListener(
    "storage",
    function(event){

      if(
        event.key === "username" ||
        event.key === "role" ||
        event.key === "roles" ||
        event.key === "userRole" ||
        event.key === "loginDate"
      ){

        checkAdmin();

      }

    }
  );


  if(
    document.readyState === "loading"
  ){

    document.addEventListener(
      "DOMContentLoaded",
      initialCheck
    );

  }else{

    initialCheck();

  }

})();
</script>

<script>

/* =========================
   VARIABLES
========================= */

let USERS = [];

let currentRolesUserId = "";


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/*
تحويل المستخدم القديم الذي لديه:

role:"assistant"

إلى:

roles:["assistant"]

وبذلك لا تتعطل الحسابات القديمة.
*/

function normalizeRoles(user){

  if(
    Array.isArray(
      user?.roles
    )
  ){

    return [
      ...new Set(
        user.roles

        .map(
          role=>
            String(
              role || ""
            )
            .trim()
            .toLowerCase()
        )

        .filter(
          role=>
            [
              "trainer",
              "assistant",
              "admin",
              "general_manager"
            ]
            .includes(role)
        )
      )
    ];

  }


  const oldRole =
    String(
      user?.role || ""
    )
    .trim()
    .toLowerCase();


  if(
    [
      "trainer",
      "assistant",
      "admin",
      "general_manager"
    ]
    .includes(
      oldRole
    )
  ){

    return [
      oldRole
    ];

  }


  return [];

}


/*
تحديد الدور الأساسي للتوافق
مع الأكواد القديمة وصفحات iframe التي تقرأ role فقط.

مهم: إذا كانت admin ضمن الصلاحيات فسيتم دائمًا حفظ:
role: "admin"
حتى لو كانت هناك صلاحيات أخرى مع admin.

الأولوية:
admin
ثم general_manager
ثم assistant
ثم trainer
*/

function getPrimaryRole(
  roles
){

  if(
    roles.includes(
      "admin"
    )
  ){
    return "admin";
  }


  if(
    roles.includes(
      "general_manager"
    )
  ){
    return "general_manager";
  }


  if(
    roles.includes(
      "assistant"
    )
  ){
    return "assistant";
  }


  if(
    roles.includes(
      "trainer"
    )
  ){
    return "trainer";
  }


  return "";

}


function getRoleName(
  role
){

  if(
    role === "general_manager"
  ){
    return "مدير عام";
  }


  if(
    role === "admin"
  ){
    return "مدير";
  }


  if(
    role === "assistant"
  ){
    return "مساعد";
  }


  if(
    role === "trainer"
  ){
    return "مدرب";
  }


  return role;

}


function getRolesBadges(
  roles
){

  if(
    !roles.length
  ){

    return `
      <span
        class="role-badge"
      >
        بدون صلاحية
      </span>
    `;

  }


  return roles

  .map(
    role=>`

      <span
        class="role-badge"
      >

        ${
          escapeHtml(
            getRoleName(
              role
            )
          )
        }

      </span>

    `
  )

  .join("");

}


/* =========================
   LOAD USERS
========================= */

db
.collection(
  "USERS"
)
.onSnapshot(

  snap=>{

    USERS=[];


    snap.forEach(
      doc=>{

        const data =
          doc.data() ||
          {};


        USERS.push({

          id:
            doc.id,

          ...data

        });

      }
    );


    renderUsers();

  },

  error=>{

    console.error(
      error
    );


    document
    .getElementById(
      "msg"
    )
    .textContent =
      "❌ تعذر تحميل المستخدمين.";

  }

);


/* =========================
   RENDER
========================= */

function renderUsers(){

  const q =
    String(
      document
      .getElementById(
        "search"
      )
      ?.value ||
      ""
    )
    .trim()
    .toLowerCase();


  const tbody =
    document
    .getElementById(
      "tbody"
    );


  tbody.innerHTML="";


  const filtered =
    USERS.filter(
      user=>{


        const username =
          String(
            user.username ||
            ""
          )
          .toLowerCase();


        const fullName =
          String(
            user.fullName ||
            ""
          )
          .toLowerCase();


        const trainerName =
          String(
            user.trainerName ||
            ""
          )
          .toLowerCase();


        return (

          username.includes(
            q
          )

          ||

          fullName.includes(
            q
          )

          ||

          trainerName.includes(
            q
          )

        );

      }
    );


  filtered.forEach(
    user=>{


      const roles =
        normalizeRoles(
          user
        );


      tbody.insertAdjacentHTML(

        "beforeend",

        `

        <tr>


          <td>

            <input

              id="u_${user.id}"

              value="${
                escapeHtml(
                  user.username ||
                  ""
                )
              }"

            >

          </td>


          <td>

            <input

              id="f_${user.id}"

              value="${
                escapeHtml(
                  user.fullName ||
                  ""
                )
              }"

            >

/* =========================
   GET NEW USER ROLES
========================= */

function getNewUserRoles(){

  return [

    ...document
    .querySelectorAll(
      ".new-role:checked"
    )

  ]

  .map(
    item=>
      item.value
  );

}


/* =========================
   ADD USER
========================= */

async function addUser(){

  const username =
    String(
      document
      .getElementById(
        "uName"
      )
      .value ||
      ""
    )
    .trim();


  const password =
    String(
      document
      .getElementById(
        "pass"
      )
      .value ||
      ""
    )
    .trim();


  const roles =
    getNewUserRoles();


  const message =
    document
    .getElementById(
      "msg"
    );


  if(
    !username ||
    !password
  ){

    message.textContent =
      "⚠️ اسم المستخدم وكلمة المرور مطلوبة.";

    return;

  }


  if(
    !roles.length
  ){

    message.textContent =
      "⚠️ اختر صلاحية واحدة على الأقل للمستخدم.";

    return;

  }


  try{


    message.textContent =
      "جاري التحقق...";


    const check =
      await db

      .collection(
        "USERS"
      )

      .where(
        "usernameLower",
        "==",
        username
        .toLowerCase()
      )

      .limit(1)

      .get();


    if(
      !check.empty
    ){

      message.textContent =
        "⚠️ اسم المستخدم موجود مسبقًا.";

      return;

    }


    const primaryRole =
      getPrimaryRole(
        roles
      );


    await db
    .collection(
      "USERS"
    )
    .add({


      username:
        username,


      usernameLower:
        username
        .toLowerCase(),


      password:
        password,


      fullName:
        String(
          document
          .getElementById(
            "fName"
          )
          .value ||
          ""
        )
        .trim(),


      trainerName:
        String(
          document
          .getElementById(
            "tName"
          )
          .value ||
          ""
        )
        .trim(),


      /*
      النظام الجديد
      */
      roles:
        roles,


      /*
      للتوافق مع النظام القديم
      */
      role:
        primaryRole,


      createdAt:
        firebase
        .firestore
        .FieldValue
        .serverTimestamp(),


      createdBy:
        localStorage
        .getItem(
          "username"
        ) ||
        ""


    });


    message.textContent =
      "✔ تم إضافة المستخدم بنجاح.";


    document
    .getElementById(
      "uName"
    )
    .value="";


    document
    .getElementById(
      "fName"
    )
    .value="";


    document
    .getElementById(
      "tName"
    )
    .value="";


    document
    .getElementById(
      "pass"
    )
    .value="";


    document
    .querySelectorAll(
      ".new-role"
    )
    .forEach(
      item=>{

        item.checked=false;

      }
    );


  }
  catch(
    error
  ){

    console.error(
      error
    );


    message.textContent =
      "❌ تعذر إضافة المستخدم.";

  }

}


/* =========================
   SAVE USER DATA
========================= */

async function saveUser(
  id
){

  const username =
    String(
      document
      .getElementById(
        "u_" + id
      )
      ?.value ||
      ""
    )
    .trim();


  const password =
    String(
      document
      .getElementById(
        "p_" + id
      )
      ?.value ||
      ""
    )
    .trim();


  if(
    !username ||
    !password
  ){

    alert(
      "اسم المستخدم وكلمة المرور مطلوبة."
    );

    return;

  }


  try{


    const duplicate =
      await db

      .collection(
        "USERS"
      )

      .where(
        "usernameLower",
        "==",
        username
        .toLowerCase()
      )

      .get();


    const duplicateUser =
      duplicate.docs.find(
        doc=>
          doc.id !== id
      );


    if(
      duplicateUser
    ){

      alert(
        "⚠️ اسم المستخدم مستخدم في حساب آخر."
      );

      return;

    }


    await db
    .collection(
      "USERS"
    )
    .doc(
      id
    )
    .update({


      username:
        username,


      usernameLower:
        username
        .toLowerCase(),


      fullName:
        document
        .getElementById(
          "f_" + id
        )
        .value
        .trim(),


      trainerName:
        document
        .getElementById(
          "t_" + id
        )
        .value
        .trim(),


      password:
        password,


      updatedAt:
        firebase
        .firestore
        .FieldValue
        .serverTimestamp(),


      updatedBy:
        localStorage
        .getItem(
          "username"
        ) ||
        ""


    });


    alert(
      "✔ تم حفظ بيانات المستخدم"
    );


  }
  catch(
    error
  ){

    console.error(
      error
    );


    alert(
      "❌ تعذر حفظ بيانات المستخدم."
    );

  }

}


/* =========================
   DELETE USER
========================= */

async function deleteUser(
  id
){

  const user =
    USERS.find(
      item=>
        item.id === id
    );


  if(
    !user
  ){
    return;
  }


  if(
    !confirm(

      "تأكيد حذف المستخدم؟\n\n" +

      (
        user.username ||
        ""
      )

    )
  ){
    return;
  }


  try{


    await db
    .collection(
      "USERS"
    )
    .doc(
      id
    )
    .delete();


  }
  catch(
    error
  ){

    console.error(
      error
    );


    alert(
      "❌ تعذر حذف المستخدم."
    );

  }

}


/* =========================
   OPEN ROLES
========================= */

function openRolesModal(
  id
){

  const user =
    USERS.find(
      item=>
        item.id === id
    );


  if(
    !user
  ){
    return;
  }


  currentRolesUserId =
    id;


  const roles =
    normalizeRoles(
      user
    );


  document
  .getElementById(
    "rolesUserName"
  )
  .innerHTML = `

    المستخدم:

    <b>
      ${
        escapeHtml(
          user.username ||
          ""
        )
      }
    </b>

    &nbsp; — &nbsp;

    ${
      escapeHtml(
        user.fullName ||
        ""
      )
    }

  `;


  document
  .querySelectorAll(
    ".edit-role"
  )
  .forEach(
    item=>{

      item.checked =
        roles.includes(
          item.value
        );

    }
  );


  document
  .getElementById(
    "rolesModal"
  )
  .classList
  .add(
    "show"
  );

}


/* =========================
   CLOSE ROLES
========================= */

function closeRolesModal(){

  document
  .getElementById(
    "rolesModal"
  )
  .classList
  .remove(
    "show"
  );


  currentRolesUserId =
    "";

}


/* =========================
   SAVE ROLES
========================= */

async function saveRoles(){

  if(!currentRolesUserId){

    alert(
      "❌ لم يتم تحديد المستخدم."
    );

    return;
  }


  const roles = [
    ...new Set(
      [
        ...document.querySelectorAll(
          ".edit-role:checked"
        )
      ]
      .map(
        item =>
          String(item.value || "")
            .trim()
            .toLowerCase()
      )
      .filter(Boolean)
    )
  ];


  if(!roles.length){

    alert(
      "⚠️ اختر صلاحية واحدة على الأقل."
    );

    return;
  }


  const primaryRole =
    getPrimaryRole(
      roles
    );


  const user =
    USERS.find(
      item =>
        item.id === currentRolesUserId
    );


  if(!user){

    alert(
      "❌ لم يتم العثور على المستخدم."
    );

    return;
  }


  const btn =
    document.querySelector(
      ".save-role-btn"
    );


  if(btn){

    btn.disabled = true;

    btn.innerHTML =
      '<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...';

  }


  try{

    const userRef =
      db
      .collection(
        "USERS"
      )
      .doc(
        currentRolesUserId
      );


    /* =========================
       SAVE TO FIRESTORE
    ========================= */

    await userRef.update({

      roles:
        roles,

      role:
        primaryRole,

      rolesUpdatedAt:
        firebase
        .firestore
        .FieldValue
        .serverTimestamp(),

      rolesUpdatedBy:
        localStorage
        .getItem(
          "username"
        ) || ""

    });


    /* =========================
       VERIFY SAVE
    ========================= */

    const savedDoc =
      await userRef.get();


    if(
      !savedDoc.exists
    ){

      throw new Error(
        "User document not found after update."
      );

    }


    const savedData =
      savedDoc.data() || {};


    const savedRoles =
      Array.isArray(
        savedData.roles
      )
      ? [
          ...new Set(
            savedData.roles
            .map(
              role =>
                String(role || "")
                  .trim()
                  .toLowerCase()
            )
            .filter(Boolean)
          )
        ]
      : [];


    if(
      !savedRoles.length
    ){

      throw new Error(
        "Roles were not saved."
      );

    }


    /* =========================
       UPDATE LOCAL USERS ARRAY
    ========================= */

    const index =
      USERS.findIndex(
        item =>
          item.id ===
          currentRolesUserId
      );


    if(
      index !== -1
    ){

      USERS[index] = {

        ...USERS[index],

        roles:
          savedRoles,

        role:
          savedData.role ||
          primaryRole

      };

    }


    /* =========================
       UPDATE CURRENT SESSION
       إذا كان المستخدم يعدل حسابه
    ========================= */

    const loggedUsername =
      String(
        localStorage.getItem(
          "username"
        ) || ""
      )
      .trim()
      .toLowerCase();


    const editedUsername =
      String(
        savedData.username ||
        user.username ||
        ""
      )
      .trim()
      .toLowerCase();


    if(
      loggedUsername &&
      loggedUsername ===
      editedUsername
    ){

      localStorage.setItem(
        "roles",
        JSON.stringify(
          savedRoles
        )
      );


      localStorage.setItem(
        "role",
        savedData.role ||
        primaryRole
      );

    }


    /* =========================
       REFRESH TABLE
    ========================= */

    renderUsers();


    alert(
      "✅ تم حفظ الصلاحيات بنجاح.\n\n" +
      "الصلاحيات: " +
      savedRoles
      .map(
        getRoleName
      )
      .join(
        " + "
      )
    );


    closeRolesModal();


  }
  catch(
    error
  ){

    console.error(
      "SAVE ROLES ERROR:",
      error
    );


    alert(
      "❌ لم يتم حفظ الصلاحيات.\n\n" +
      (
        error.message ||
        "حدث خطأ في Firestore"
      )
    );

  }
  finally{

    if(btn){

      btn.disabled = false;

      btn.innerHTML =
        '<i class="fa-solid fa-floppy-disk"></i> حفظ الصلاحيات';

    }

  }

}
