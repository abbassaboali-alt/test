<style>
/* =========================================================
   PRUDLE — FULL WIDTH / FULL SCREEN + ULTRA NARROW MARGINS
   Weebly / Caspio Safe + Mobile Friendly
========================================================= */

/* 1) الصفحة بكامل العرض بدون أي هوامش */
html, body{
  margin:0 !important;
  padding:0 !important;
  width:100% !important;
  max-width:100% !important;
  overflow-x:hidden !important;
}

/* 2) كل العناصر داخل الصفحة لا تكسر العرض */
*,
*::before,
*::after{
  box-sizing:border-box !important;
}

/* 3) كسر أي حاويات من القالب قد تقيد العرض */
.container, .section, .wrapper, .content, .main-content,
#page, #main, #body, #content,
[class*="container"], [class*="wrapper"], [class*="content"]{
  width:100% !important;
  max-width:100% !important;
  margin:0 !important;
  padding:0 !important;
}

/* 4) هوامش داخلية عامة (تضييق الهوامش) */
:root{
  --gutter: 6px;          /* ✅ غيّرها 4px أو 8px حسب رغبتك */
  --radius: 14px;
}

/* أي عنصر رئيسي في الصفحة خليه يستفيد من الـ gutter */
body{
  font-family:'Tajawal', sans-serif;
  background:#f4f6fb;
  padding:var(--gutter) !important;  /* ✅ يديك هامش صغير جدًا حول الصفحة */
}

/* 5) تقليل هوامش عناصر واجهتك (بدون ما تخرب التصميم) */
.logout-badge,
.header,
.actions,
.stats,
.filters,
.wrap{
  margin:var(--gutter) !important;
}

/* 6) تحسين العرض على الجوال (هوامش أضيق + تكبير لمس) */
@media (max-width: 768px){
  :root{ --gutter: 4px; }
  .header{ font-size:18px !important; }
  .header img{ width:58px !important; height:58px !important; }
  .btn{ padding:10px 12px !important; }
}

/* 7) الجدول: اجعله يتمدد ولا يخرج خارج الشاشة */
table{
  width:max-content;
  max-width:100%;
}
.course-body{
  overflow-x:auto !important;
  -webkit-overflow-scrolling:touch;
}

/* 8) منع أي عنصر يسبب سكرول أفقي بالقوة */
img, video, canvas{
  max-width:100% !important;
  height:auto !important;
}
</style>

@keyframes liveBlink{
  0%{opacity:1;}
  50%{
    opacity:.4;
    transform:scale(1.05);
  }
  100%{opacity:1;}
}

.live-online{
  animation:liveBlink 1s infinite;
  border:3px solid #ff3b30 !important;
  box-shadow:0 0 20px #ff3b30 !important;
  position:relative;
}

.live-online::after{
  content:"LIVE";
  position:absolute;
  top:-8px;
  left:-8px;
  background:#ff3b30;
  color:#fff;
  padding:4px 8px;
  border-radius:10px;
  font-size:11px;
  font-weight:900;
}

/* ===== TASK ASSIGNMENT NOTIFICATION ===== */
.task-nav-wrap{
  position:relative;
}
.task-alert-btn{
  position:relative;
}
.task-count-badge{
  display:none;
  min-width:24px;
  height:24px;
  padding:0 7px;
  border-radius:999px;
  align-items:center;
  justify-content:center;
  background:#ff3b30;
  color:#fff;
  font-size:11px;
  font-weight:900;
  margin-inline-start:auto;
  box-shadow:0 0 0 3px rgba(255,255,255,.18);
}
.task-alert-btn.has-task-count .task-count-badge{
  display:inline-flex;
}

/* وميض لحظي حسب أولوية آخر مهمة تم إسنادها */
.task-alert-btn.task-flash-high{
  animation:taskBlinkHigh .55s ease-in-out 10;
  border:3px solid #ff3b30 !important;
  background:linear-gradient(135deg,#b91c1c,#ef4444) !important;
  color:#fff !important;
  box-shadow:0 0 0 4px rgba(255,59,48,.20),0 0 28px rgba(255,59,48,.95) !important;
}
.task-alert-btn.task-flash-medium{
  animation:taskBlinkMedium .55s ease-in-out 10;
  border:3px solid #f59e0b !important;
  background:linear-gradient(135deg,#b45309,#f59e0b) !important;
  color:#fff !important;
  box-shadow:0 0 0 4px rgba(245,158,11,.20),0 0 28px rgba(245,158,11,.95) !important;
}
.task-alert-btn.task-flash-low{
  animation:taskBlinkLow .55s ease-in-out 10;
  border:3px solid #22c55e !important;
  background:linear-gradient(135deg,#15803d,#22c55e) !important;
  color:#fff !important;
  box-shadow:0 0 0 4px rgba(34,197,94,.20),0 0 28px rgba(34,197,94,.95) !important;
}
.task-alert-btn.task-flash-high .task-count-badge{
  background:#7f1d1d !important;
}
.task-alert-btn.task-flash-medium .task-count-badge{
  background:#92400e !important;
}
.task-alert-btn.task-flash-low .task-count-badge{
  background:#166534 !important;
}

@keyframes taskBlinkHigh{
  0%,100%{transform:scale(1);filter:brightness(1)}
  50%{transform:scale(1.045);filter:brightness(1.35)}
}
@keyframes taskBlinkMedium{
  0%,100%{transform:scale(1);filter:brightness(1)}
  50%{transform:scale(1.045);filter:brightness(1.30)}
}
@keyframes taskBlinkLow{
  0%,100%{transform:scale(1);filter:brightness(1)}
  50%{transform:scale(1.045);filter:brightness(1.25)}
}

.task-assignee-popover{
  display:none;
  position:absolute;
  right:100%;
  top:0;
  width:300px;
  max-height:340px;
  overflow:auto;
  margin-right:10px;
  padding:12px;
  background:#fff;
  color:#16324d;
  border:1px solid #dbe6f2;
  border-radius:16px;
  box-shadow:0 18px 44px rgba(0,0,0,.18);
  z-index:9999;
}
.task-nav-wrap:hover .task-assignee-popover{
  display:block;
}
.task-assignee-popover h4{
  margin:0 0 9px;
  color:#164478;
  font-size:14px;
}
.task-assignee-item{
  padding:9px 10px;
  border-radius:10px;
  background:#f6f9fd;
  margin-bottom:7px;
  font-size:12px;
  font-weight:800;
  line-height:1.55;
  border-right:4px solid #94a3b8;
}
.task-assignee-item.priority-high{
  border-right-color:#ef4444;
  background:#fff1f2;
}
.task-assignee-item.priority-medium{
  border-right-color:#f59e0b;
  background:#fffbeb;
}
.task-assignee-item.priority-low{
  border-right-color:#22c55e;
  background:#f0fdf4;
}
.task-assignee-item small{
  display:block;
  color:#718096;
  font-size:10px;
  font-weight:700;
}
.task-assignee-empty{
  color:#718096;
  font-size:12px;
}
.task-ticker-note{
  margin-top:10px;
  padding:10px 14px;
  border-radius:14px;

/* =========================================================
   ✨ الشريط المتحرك — عرض الدورات المفتوحة تلقائياً من Firestore
========================================================= */
function getCourseTickerLabel(c){
  const courseName =
    c.TrainingCourse ||
    c.CourseName ||
    c.courseName ||
    c.Level ||
    c.level ||
    "";

  const section =
    c.Section ||
    c.section ||
    c.Gender ||
    c.gender ||
    "";

  const branch =
    c.Branch ||
    c.branch ||
    "";

  const period =
    c.Period ||
    c.period ||
    "";

  const parts = [];

  if(courseName) parts.push(courseName);
  if(section) parts.push(section);
  if(branch) parts.push(branch);
  if(period) parts.push(period);

  return parts.join(" - ");
}

function renderOpenCoursesTicker(courses){
  const movingText = document.getElementById("movingText");
  if(!movingText) return;

  const t = UI_TEXT[DASH_LANG];

  if(!courses || !courses.length){
    movingText.textContent = t.tickerEmpty;
    return;
  }

  movingText.textContent =
    t.tickerPrefix +
    courses.join("   •   ") +
    "   —   ";
}

function loadOpenCoursesTicker(){

  const movingText =
    document.getElementById("movingText");

  if(!movingText) return;

  movingText.textContent = UI_TEXT[DASH_LANG].tickerLoading;

  db.collection("Courses")
    .where("status","==","open")
    .onSnapshot(snapshot=>{

      const courses = [];

      snapshot.forEach(doc=>{

        const c = doc.data() || {};
        const label = getCourseTickerLabel(c);

        if(label){
          courses.push(label);
        }

      });

      /* إزالة التكرار */
      const uniqueCourses =
        [...new Set(courses)];

      window.OPEN_TICKER_COURSES = uniqueCourses;
      renderOpenCoursesTicker(uniqueCourses);

    },error=>{

      console.error(
        "Open courses ticker error:",
        error
      );

      movingText.textContent = UI_TEXT[DASH_LANG].tickerError;

    });
}

/* =========================================================
   🔔 إشعار لحظي عند إسناد مهمة — اللون حسب الأولوية
   High = أحمر | Medium = برتقالي | Low = أخضر
========================================================= */
let TASKS_SNAPSHOT = [];
let TASKS_LISTENER_READY = false;
let TASK_FLASH_TIMER = null;

function safeTaskText(v){
  return String(v == null ? "" : v).trim();
}

function taskPriorityValue(priority){
  const p = safeTaskText(priority).toLowerCase();
  if(p === "high") return 3;
  if(p === "medium") return 2;
  return 1;
}

function normalizeTaskPriority(priority){
  const p = safeTaskText(priority).toLowerCase();
  if(p === "high" || p === "medium" || p === "low") return p;
  return "medium";
}

function highestTaskPriority(tasks){
  if(!tasks || !tasks.length) return "medium";
  return tasks
    .map(t=>normalizeTaskPriority(t.priority))
    .sort((a,b)=>taskPriorityValue(b)-taskPriorityValue(a))[0] || "medium";
}

function priorityArabic(priority){
  return ({
    high:"عالية",
    medium:"متوسطة",
    low:"منخفضة"
  })[normalizeTaskPriority(priority)];
}

function flashTaskAssignment(priority){
  const p = normalizeTaskPriority(priority);
  const sideBtn = document.getElementById("tasksBtnSide");
  const mobileBtn = document.getElementById("tasksBtnMobile");

  [sideBtn,mobileBtn].forEach(btn=>{
    if(!btn) return;
    btn.classList.remove("task-flash-high","task-flash-medium","task-flash-low");
    requestAnimationFrame(function(){
      btn.classList.add("task-flash-"+p);
    });
  });

  if(TASK_FLASH_TIMER) clearTimeout(TASK_FLASH_TIMER);

  /* الوميض لحظي لمدة تقريباً 5.5 ثانية ثم يعود الزر لطبيعته */
  TASK_FLASH_TIMER = setTimeout(()=>{
    [sideBtn,mobileBtn].forEach(btn=>{
      if(btn) btn.classList.remove("task-flash-high","task-flash-medium","task-flash-low");
    });
  },5600);
}

function renderTaskAssignmentAlert(){
  const sideBtn = document.getElementById("tasksBtnSide");
  const mobileBtn = document.getElementById("tasksBtnMobile");
  const sideBadge = document.getElementById("tasksCountSide");
  const mobileBadge = document.getElementById("tasksCountMobile");
  const listBox = document.getElementById("taskAssigneeList");
  const tickerNote = document.getElementById("taskTickerNote");
  const tickerNames = document.getElementById("taskTickerNames");

  const activeTasks = TASKS_SNAPSHOT.filter(t =>
    t.status === "assigned" || t.status === "in_progress"
  );

  const waitingTasks = TASKS_SNAPSHOT.filter(t =>
    t.status === "assigned"
  );

  const alertCount = waitingTasks.length;

  if(sideBadge) sideBadge.textContent = alertCount;
  if(mobileBadge) mobileBadge.textContent = alertCount;

  [sideBtn,mobileBtn].forEach(btn=>{
    if(!btn) return;
    btn.classList.toggle("has-task-count",alertCount > 0);
  });

  /* التجميع الآن حسب اسم الموظف فقط — بدون رقم موظف */
  const byEmployee = new Map();

  activeTasks.forEach(t=>{
    const name = safeTaskText(t.employeeName) || "غير محدد";
    const key = name.toLowerCase();
    const priority = normalizeTaskPriority(t.priority);

    const current = byEmployee.get(key) || {
      name,
      count:0,
      assigned:0,
      progress:0,
      priorities:[]
    };

    current.count++;
    current.priorities.push(priority);

    if(t.status === "assigned") current.assigned++;
    if(t.status === "in_progress") current.progress++;

    byEmployee.set(key,current);
  });

  const employees = [...byEmployee.values()]
    .map(e=>({
      ...e,
      priority:highestTaskPriority(e.priorities.map(priority=>({priority})))
    }))
    .sort((a,b)=>
      taskPriorityValue(b.priority)-taskPriorityValue(a.priority) ||
      b.count-a.count ||
      a.name.localeCompare(b.name,"ar")
    );

  if(listBox){
    if(!employees.length){
      listBox.className = "task-assignee-empty";
      listBox.innerHTML = "لا توجد مهام مسندة حالياً";
    }else{
      listBox.className = "";
      listBox.innerHTML = employees.map(e=>`
        <div class="task-assignee-item priority-${e.priority}">
          ${e.name}
          <small>
            أولوية ${priorityArabic(e.priority)}
            • ${e.count} مهمة
            ${e.assigned ? ` • ${e.assigned} بانتظار الاستلام` : ""}
            ${e.progress ? ` • ${e.progress} قيد الإجراء` : ""}
          </small>
        </div>
      `).join("");
    }
  }

  if(tickerNote && tickerNames){
    if(employees.length){
      const topPriority = highestTaskPriority(activeTasks);

      tickerNote.style.display = "block";
      tickerNote.classList.remove("priority-high","priority-medium","priority-low");
      tickerNote.classList.add("priority-"+topPriority);

      tickerNames.textContent =
        "🔔 مهام مسندة إلى: " +
        employees.map(e=>`${e.name} — ${priorityArabic(e.priority)} (${e.count})`).join("  •  ") +
        "   —   ";
    }else{
      tickerNote.style.display = "none";
      tickerNote.classList.remove("priority-high","priority-medium","priority-low");
      tickerNames.textContent = "";
    }
  }
}

db.collection("EmployeeTasks")
  .onSnapshot(snapshot=>{

    /* أول تحميل لا يسبب وميض للمهام القديمة */
    if(TASKS_LISTENER_READY){
      const justAssigned = snapshot.docChanges()
        .filter(change =>
          change.type === "added" &&
          ((change.doc.data() && change.doc.data().status) || "assigned") === "assigned"
        )
        .map(change=>({
          id:change.doc.id,
          ...(change.doc.data() || {})
        }));

      if(justAssigned.length){
        flashTaskAssignment(highestTaskPriority(justAssigned));
      }
    }

    TASKS_SNAPSHOT = snapshot.docs.map(doc=>({
      id:doc.id,
      ...(doc.data() || {})
    }));

    renderTaskAssignmentAlert();
    TASKS_LISTENER_READY = true;

  },error=>{
    console.error("EmployeeTasks notification error:",error);
  });

/* =========================================================
   النسخ الاحتياطي المباشر من لوحة التحكم
========================================================= */
async function backupFirestoreFromDashboard(){
  const collections = [
    "Courses",
    "students",
    "Trainers",
    "TrainersRates",
    "BreakSettings",
    "users",
    "questions",
    "exams",
    "cefr_results",
    "EmployeeTasks",
    "AdminMeetLinks",
    "FakeRegistrations",
    "FakePromotions"
  ];

  const backup = {
    projectId:"prudle-system",
    exportedAt:new Date().toISOString(),
    collections:{}
  };

  const failed = [];

  try{
    for(const collectionName of collections){
      try{
        const snap = await db.collection(collectionName).get();
        backup.collections[collectionName] = {};

        snap.forEach(doc=>{
          backup.collections[collectionName][doc.id] = doc.data();
        });
      }catch(error){
        console.warn("Backup skipped:",collectionName,error);
        failed.push(collectionName);
      }
    }

    const blob = new Blob(
      [JSON.stringify(backup,null,2)],
      {type:"application/json;charset=utf-8"}
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const now = new Date();
    const stamp = [
      now.getFullYear(),
      String(now.getMonth()+1).padStart(2,"0"),
      String(now.getDate()).padStart(2,"0"),
      "_",
      String(now.getHours()).padStart(2,"0"),
      String(now.getMinutes()).padStart(2,"0")
    ].join("");

    a.href = url;
    a.download = `prudle-firestore-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);

    if(failed.length){
      alert("تم تنزيل النسخة الاحتياطية، وتعذر الوصول إلى بعض المجموعات: " + failed.join(", "));
    }else{
      alert("تم تنزيل النسخة الاحتياطية بنجاح");
    }
  }catch(error){
    console.error("Backup error:",error);
    alert("تعذر إنشاء النسخة الاحتياطية. تحقق من صلاحيات Firestore ثم حاول مرة أخرى.");
  }
}

if(type === "online" && LIVE_MEET_LINK){
  html += card([
    "الانضمام للاجتماع المباشر",
    "fa-circle-play",
    LIVE_MEET_LINK,
    "red",
    "اضغط هنا للدخول إلى Google Meet المباشر"
  ]);
}    html += `</div>`;
  });

  document.getElementById("content").innerHTML = html;
}

/* =========================================================

========================================================= */
db.collection("AdminMeetLinks")
.onSnapshot(snap=>{

  let active = false;

  snap.forEach(doc=>{

    const d = doc.data() || {};

    if(d.meetLink){
      active = true;
    }

  });

  const sideBtn =
    document.getElementById("onlineBtnSide");

  const mobileBtn =
    document.getElementById("onlineBtnMobile");

  if(active){

    sideBtn?.classList.add("live-online");
    mobileBtn?.classList.add("live-online");

  }else{

    sideBtn?.classList.remove("live-online");
    mobileBtn?.classList.remove("live-online");

  }

});
db.collection("AdminMeetLinks")
.orderBy("createdAt","desc")
.limit(1)
.onSnapshot(snap=>{

  LIVE_MEET_LINK = "";

  snap.forEach(doc=>{
    const d = doc.data() || {};

    if(d.meetLink){
      LIVE_MEET_LINK = d.meetLink;
    }
  });

  const sideBtn =
    document.getElementById("onlineBtnSide");

  const mobileBtn =
    document.getElementById("onlineBtnMobile");

  if(LIVE_MEET_LINK){

    sideBtn?.classList.add("live-online");
    mobileBtn?.classList.add("live-online");

  }else{

    sideBtn?.classList.remove("live-online");
    mobileBtn?.classList.remove("live-online");

  }

});
