<!-- TRAINER ACCESS PROTECTION REMOVED -->

<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Trainer Attendance</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{margin:0;font-family:Poppins,Arial,sans-serif;background:#f6f8fb}
header{background:#fff;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.logo{width:45px;border-radius:50%}
.card{background:#fff;padding:20px;border-radius:14px;width:92%;max-width:900px;margin:20px auto;box-shadow:0 4px 12px rgba(0,0,0,.1)}
select{padding:10px;border-radius:8px;font-size:15px;max-width:92%}
button{padding:9px 16px;border:none;border-radius:6px;font-size:14px;cursor:pointer;margin:4px}
.in{background:#2ecc71;color:#fff}
.break{background:#ff9800;color:#fff}
.out{background:#d33;color:#fff}
.reset{background:#555;color:#fff}
.logout{background:#164478;color:#fff;border-radius:30px;padding:8px 20px}
.row{margin:6px 0;font-size:15px}
.label{font-weight:700;color:#164478}
.timer{font-size:22px;font-weight:700;margin:10px 0;color:#2ecc71}
.timer.warn{color:#e67e22}
.timer.danger{color:#d33}
.break-info{margin:12px 0;padding:11px;border-radius:10px;background:#fff5df;color:#a45b00;font-weight:800}

/* CHECK POPUP */
.check-overlay{
  position:fixed;
  right:18px;
  top:18px;
  z-index:99999;
  display:none;
  width:min(360px,calc(100vw - 24px));
  pointer-events:none;
}
.check-overlay.show{display:block}
.check-modal{
  position:relative;
  width:100%;
  background:#fff;
  border-radius:18px;
  padding:18px;
  text-align:center;
  border-top:5px solid #164478;
  box-shadow:0 14px 40px rgba(0,0,0,.24);
  pointer-events:auto;
}
.check-x{
  position:absolute;left:9px;top:8px;
  width:32px;height:32px;border:0;border-radius:50%;
  background:#eef2f6;color:#52606d;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;margin:0
}
.check-logo{width:58px;height:58px;object-fit:contain;border-radius:50%}
.check-modal h2{margin:8px 0;color:#164478;font-size:31px}
.check-modal p{color:#657384;font-size:14px;line-height:1.7}
.popup-course{width:100%;margin:8px 0 12px}
.popup-break{
  margin:10px 0 15px;padding:13px;border-radius:12px;
  background:#fff3d8;color:#9b5c00;font-weight:900
}
.popup-check{
  width:100%;padding:14px;font-size:17px;font-weight:900;
  border-radius:12px;background:#2ecc71;color:#fff
}
.popup-check:disabled{opacity:.45;cursor:not-allowed}
.popup-close{
  width:100%;margin-top:8px;padding:11px;border-radius:12px;
  background:#eef2f6;color:#52606d;font-weight:800
}
@media(max-width:600px){
  header{padding:12px;gap:8px}
  header h2{font-size:17px}
  .card{width:90%;padding:16px}
  .check-overlay{
    top:10px;right:10px;
    width:calc(100vw - 20px);
  }
  .check-modal{padding:15px}
  .check-modal h2{font-size:24px}
}
</style>
</head>

<body>

<header>
  <h2>
    <img class="logo" src="https://prudle.edu.sa/wp-content/uploads/2020/11/about.png">
    Trainer Attendance
  </h2>
  <div id="userBox" style="font-weight:700;color:#164478"></div>
</header>

<div style="text-align:center;margin:20px">
  <button class="logout" onclick="logout()">
    <i class="fa-solid fa-right-from-bracket"></i> Logout
  </button>
</div>

<div style="text-align:center">
  <select id="courseSelect">
    <option value="">Select Course</option>
  </select>
</div>

<div id="attendanceArea"></div>

<!-- تظهر تلقائياً إذا لم يوجد startTS اليوم -->
<div id="checkOverlay" class="check-overlay">
  <div class="check-modal">
    <button class="check-x" type="button" onclick="closeCheckPopup()" aria-label="Close">×</button>
    <img class="check-logo" src="https://prudle.edu.sa/wp-content/uploads/2020/11/about.png">
    <h2>CHECK</h2>
    <p id="popupTrainer"></p>
    <p>لم يتم تسجيل Check-In اليوم. اختر الدورة ثم اضغط CHECK-IN.</p>

    <select id="popupCourseSelect" class="popup-course">
      <option value="">Select Course</option>
    </select>

    <div id="popupBreakInfo" class="popup-break">
      Break Time: --
    </div>

    <button id="popupCheckBtn" class="popup-check" onclick="popupCheckIn()" disabled>
      <i class="fa-solid fa-circle-check"></i> CHECK-IN
    </button>

    <button class="popup-close" onclick="closeCheckPopup()">
      الدخول للشاشة بدون تسجيل
    </button>
  </div>
</div>

<script>
if(!firebase.apps.length){
  firebase.initializeApp({
    apiKey:"AIzaSyCCFBvZosI8dwShZjxvZzI-SU5igEbcOKk",
    authDomain:"prudle-system.firebaseapp.com",
    projectId:"prudle-system"
  });
}
const db=firebase.firestore();

const user=localStorage.getItem("username");
const userBox=document.getElementById("userBox");
const courseSelect=document.getElementById("courseSelect");
const attendanceArea=document.getElementById("attendanceArea");
const checkOverlay=document.getElementById("checkOverlay");
const popupCourseSelect=document.getElementById("popupCourseSelect");
const popupBreakInfo=document.getElementById("popupBreakInfo");
const popupCheckBtn=document.getElementById("popupCheckBtn");
const popupTrainer=document.getElementById("popupTrainer");

userBox.innerText="Trainer: "+user;
popupTrainer.innerText="Trainer: "+user;

let dayDoc=null;
let dayUnsub=null;
let breakMinutes=10;
let breakStartTime="";
let breakNote="";
let timerInt=null;
let coursesMap=new Map();
let openCourses=[];
let selectedCourseId="";

function clean(v){return String(v??"").trim()}
function todayISO(){return new Date().toISOString().split("T")[0]}
function fmt(ts){
  if(!ts)return "--";
  return ts.toDate().toLocaleTimeString("en-GB");
}
function safeId(value){
  try{return btoa(unescape(encodeURIComponent(value))).replace(/[+/=]/g,"_")}
  catch(e){return String(value).replace(/[^a-z0-9_-]/gi,"_")}
}
function branch(c){return clean(c.branch||c.Branch)}
function section(c){return clean(c.section||c.Section)}
function courseName(c){return clean(c.TrainingCourse||c.Course||c.courseName||c.Program||"Course")}
function period(c){return clean(c.Period||c.period)}

function showCheckPopup(){checkOverlay.classList.add("show")}
function closeCheckPopup(){checkOverlay.classList.remove("show")}

async function loadBreakSetting(courseId){
  const c=coursesMap.get(courseId)||{};
  let duration=10, start="", note="";

  // أولوية: إعداد خاص بالدورة
  const courseSnap=await db.collection("BreakSettings")
    .doc("course_"+courseId).get().catch(()=>null);

  if(courseSnap?.exists && courseSnap.data()?.enabled!==false){
    const d=courseSnap.data()||{};
    duration=Number(d.duration)||10;
    start=clean(d.breakStart);
    note=clean(d.note);
  }else{
    // توافق مع الإعداد السابق: فرع/قسم ثم Global
    const b=branch(c), s=section(c);
    const globalSnap=await db.collection("BreakSettings")
      .doc("GlobalSettings").get().catch(()=>null);

    if(globalSnap?.exists){
      const d=globalSnap.data()||{};
      duration=Number(d.duration)||10;
      start=clean(d.breakStart);
      note=clean(d.note);
    }

    if(b&&s){
      const scoped=await db.collection("BreakSettings")
        .doc("scope_"+safeId(b+"||"+s)).get().catch(()=>null);
      if(scoped?.exists){
        const d=scoped.data()||{};
        duration=Number(d.duration)||duration;
        start=clean(d.breakStart)||start;
        note=clean(d.note)||note;
      }
    }
  }

  breakMinutes=duration;
  breakStartTime=start;
  breakNote=note;

  const timePart=start ? ` · Start ${start}` : "";
  popupBreakInfo.textContent=
    `Break: ${duration} Minutes${timePart}${note?" · "+note:""}`;
}

/* حساب الأسبوع */
async function calcWeek(courseId){
  const snap=await db.collection("Courses")
    .doc(courseId).collection("Attendance").get();
  return Math.floor(snap.size/5)+1;
}

/* فحص الدورة: النافذة تعتمد على Firestore startTS وليس localStorage */
async function checkCourseToday(courseId, allowPopup=true){
  if(!courseId)return false;

  selectedCourseId=courseId;
  courseSelect.value=courseId;
  popupCourseSelect.value=courseId;

  await loadBreakSetting(courseId);

  const ref=db.collection("Courses").doc(courseId)
    .collection("Attendance").doc(todayISO());

  const snap=await ref.get();
  const checked=!!(snap.exists && snap.data()?.startTS);

  if(checked){
    closeCheckPopup();
  }else if(allowPopup){
    showCheckPopup();
  }

  popupCheckBtn.disabled=checked;
  popupCheckBtn.innerHTML=checked
    ? '<i class="fa-solid fa-check"></i> ALREADY CHECKED-IN'
    : '<i class="fa-solid fa-circle-check"></i> CHECK-IN';

  return checked;
}

/* تحميل دورات المدرب ثم إظهار CHECK فوراً عند الحاجة */
db.collection("Courses").where("Trainer","==",user)
.onSnapshot(async s=>{
  openCourses=[];
  coursesMap.clear();

  s.forEach(doc=>{
    const c={id:doc.id,...doc.data()};
    if(clean(c.status).toLowerCase()==="closed")return;
    openCourses.push(c);
    coursesMap.set(doc.id,c);
  });

  const options=openCourses.map(c=>`
    <option value="${c.id}">
      ${courseName(c)}${period(c)?" - "+period(c):""}
    </option>`).join("");

  courseSelect.innerHTML='<option value="">Select Course</option>'+options;
  popupCourseSelect.innerHTML='<option value="">Select Course</option>'+options;

  if(!openCourses.length){
    closeCheckPopup();
    popupBreakInfo.textContent="No open courses";
    return;
  }

  /*
    نفحص كل الدورات المفتوحة.
    أول دورة ليس لديها startTS اليوم => تظهر النافذة فوراً.
    إذا كل الدورات لديها startTS => لا تظهر النافذة بعد التحديث.
  */
  let courseNeedingCheck=null;

  for(const c of openCourses){
    const snap=await db.collection("Courses").doc(c.id)
      .collection("Attendance").doc(todayISO()).get();

    if(!(snap.exists && snap.data()?.startTS)){
      courseNeedingCheck=c;
      break;
    }
  }

  if(courseNeedingCheck){
    popupCourseSelect.value=courseNeedingCheck.id;
    courseSelect.value=courseNeedingCheck.id;
    await checkCourseToday(courseNeedingCheck.id,true);
    await prepareDay(courseNeedingCheck.id);
  }else{
    closeCheckPopup();
    // عرض أول دورة فقط دون إعادة CHECK
    courseSelect.value=openCourses[0].id;
    popupCourseSelect.value=openCourses[0].id;
    await prepareDay(openCourses[0].id);
  }
});

/* تغيير الدورة داخل النافذة */
popupCourseSelect.onchange=async()=>{
  const id=popupCourseSelect.value;
  popupCheckBtn.disabled=!id;
  if(!id){
    popupBreakInfo.textContent="Break Time: --";
    return;
  }
  courseSelect.value=id;
  await checkCourseToday(id,true);
  await prepareDay(id);
};

/* تغيير الدورة الرئيسية */
courseSelect.onchange=async()=>{
  if(!courseSelect.value){
    attendanceArea.innerHTML="";
    return;
  }
  popupCourseSelect.value=courseSelect.value;
  await prepareDay(courseSelect.value);
  await checkCourseToday(courseSelect.value,true);
};

async function prepareDay(courseId){
  if(!courseId)return;

  selectedCourseId=courseId;
  await loadBreakSetting(courseId);

  const week=await calcWeek(courseId);
  dayDoc=db.collection("Courses").doc(courseId)
    .collection("Attendance").doc(todayISO());

  const snap=await dayDoc.get();

  if(!snap.exists){
    await dayDoc.set({
      Trainer:user,
      Date:todayISO(),
      Week:week,
      startTS:null,
      breakStartTS:null,
      breakEndTS:null,
      breakEndExpected:null,
      endTS:null,
      status:""
    });
  }

  if(dayUnsub)dayUnsub();
  dayUnsub=dayDoc.onSnapshot(d=>{
    const data=d.data()||{};
    render(data);

    // بمجرد وجود startTS تغلق النافذة، ولذلك لا تعود بعد Refresh.
    if(data.startTS)closeCheckPopup();
  });
}

/* CHECK-IN من النافذة */
async function popupCheckIn(){
  const courseId=popupCourseSelect.value;
  if(!courseId)return;

  popupCheckBtn.disabled=true;

  await prepareDay(courseId);

  const snap=await dayDoc.get();
  if(!(snap.exists && snap.data()?.startTS)){
    await dayDoc.set({
      Trainer:user,
      Date:todayISO(),
      startTS:firebase.firestore.FieldValue.serverTimestamp(),
      status:"Checked-In"
    },{merge:true});
  }

  closeCheckPopup();
}

/* Render */
function render(d){
  const breakText=
    `${breakMinutes} Minutes`+
    (breakStartTime?` · Start ${breakStartTime}`:"")+
    (breakNote?` · ${breakNote}`:"");

  attendanceArea.innerHTML=`
    <div class="card">
      <h3 style="color:#164478">Week ${d.Week||"-"} – ${d.Date||todayISO()}</h3>

      <div class="break-info">
        <i class="fa-solid fa-mug-hot"></i>
        <strong>Break:</strong> ${breakText}
      </div>

      <div class="row"><span class="label">Check-In:</span> ${fmt(d.startTS)}</div>
      <div class="row"><span class="label">Break-In:</span> ${fmt(d.breakStartTS)}</div>
      <div class="row"><span class="label">Break-Out:</span> ${fmt(d.breakEndTS)}</div>
      <div class="row"><span class="label">Check-Out:</span> ${fmt(d.endTS)}</div>
      <div class="row"><span class="label">Status:</span> ${d.status||"-"}</div>

      <div id="timer" class="timer">--:--</div>

      <div style="margin-top:15px">
        <button class="in" onclick="checkIn()">Check-In</button>
        <button class="break" onclick="breakIn()">Break-In</button>
        <button class="break" onclick="breakOut()">Break-Out</button>
        <button class="out" onclick="checkOut()">Check-Out</button>
        <button class="reset" onclick="resetDay()">Reset</button>
      </div>
    </div>`;

  if(d.breakEndExpected)startTimer(d.breakEndExpected.toDate());
  else clearInterval(timerInt);
}

function startTimer(end){
  clearInterval(timerInt);
  const el=document.getElementById("timer");

  function tick(){
    const diff=end-new Date();
    if(diff<=0){
      el.textContent="00:00";
      el.className="timer danger";
      clearInterval(timerInt);
      return;
    }
    const m=Math.floor(diff/60000);
    const s=Math.floor((diff%60000)/1000);
    el.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
    el.className=diff<60000?"timer warn":"timer";
  }
  tick();
  timerInt=setInterval(tick,1000);
}

async function ensureDay(){
  if(!dayDoc && courseSelect.value)await prepareDay(courseSelect.value);
  return !!dayDoc;
}

async function checkIn(){
  if(!await ensureDay())return;
  await dayDoc.update({
    startTS:firebase.firestore.FieldValue.serverTimestamp(),
    status:"Checked-In"
  });
  closeCheckPopup();
}

async function breakIn(){
  if(!await ensureDay())return;
  const end=new Date();
  end.setMinutes(end.getMinutes()+breakMinutes);
  await dayDoc.update({
    breakStartTS:firebase.firestore.FieldValue.serverTimestamp(),
    breakEndExpected:firebase.firestore.Timestamp.fromDate(end),
    status:"On Break"
  });
}

async function breakOut(){
  if(!await ensureDay())return;
  clearInterval(timerInt);
  await dayDoc.update({
    breakEndTS:firebase.firestore.FieldValue.serverTimestamp(),
    breakEndExpected:null,
    status:"Back From Break"
  });
}

async function checkOut(){
  if(!await ensureDay())return;
  await dayDoc.update({
    endTS:firebase.firestore.FieldValue.serverTimestamp(),
    status:"Checked-Out"
  });
}

async function resetDay(){
  if(!await ensureDay())return;
  clearInterval(timerInt);
  await dayDoc.update({
    startTS:null,
    breakStartTS:null,
    breakEndTS:null,
    breakEndExpected:null,
    endTS:null,
    status:""
  });
  // بعد Reset لا يوجد startTS، لذلك تظهر CHECK مجدداً.
  showCheckPopup();
}

function logout(){
  localStorage.clear();
  sessionStorage.clear();

  if(window.parent&&window.parent!==window){
    window.parent.postMessage("PRUDLE_LOGOUT","*");
  }

  location.replace("https://www.prudle-education.com/log-in-out");
}

window.addEventListener("beforeunload",()=>{
  if(dayUnsub)dayUnsub();
  clearInterval(timerInt);
});
</script>
</body>
</html>
